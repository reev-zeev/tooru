apiVersion: apps/v1
kind: Deployment
metadata:
  name: waslah-workers
  labels:
    app.kubernetes.io/name: waslah
    app.kubernetes.io/component: workers
spec:
  replicas: 6
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: waslah
      app.kubernetes.io/component: workers
  template:
    metadata:
      labels:
        app.kubernetes.io/name: waslah
        app.kubernetes.io/component: workers
    spec:
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: waslah
              app.kubernetes.io/component: workers
      containers:
        - name: workers
          image: ghcr.io/waslah/workers:REPLACE_WITH_RELEASE_SHA
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: waslah-worker-secrets
            - configMapRef:
                name: waslah-worker-config
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3001
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3001
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: '2'
              memory: 1Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: waslah-workers
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: waslah-workers
  minReplicas: 6
  maxReplicas: 400
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: waslah-workers
spec:
  minAvailable: 75%
  selector:
    matchLabels:
      app.kubernetes.io/name: waslah
      app.kubernetes.io/component: workers
